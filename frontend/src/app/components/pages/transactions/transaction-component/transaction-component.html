<section class="transactions-shell">
  <header class="transactions-header">
    <div>
      <p class="transactions-eyebrow">Cash flow</p>
      <h1>Transactions</h1>
      <p>Manage every income and expense from one place.</p>
    </div>
    <p-button label="New transaction" icon="pi pi-plus" styleClass="app-button app-button--primary" (onClick)="openNewTransactionModal()" />
  </header>

  <p-card class="transactions-card">
    <ng-template #header>
      <div class="transactions-toolbar">
        <div class="toolbar-copy">
          <h2>Transaction history</h2>
          <p>Filter, review and keep your records up to date.</p>
        </div>
        <div class="analysis-control">
          <span class="analysis-control__icon"><i class="pi pi-calculator"></i></span>
          <span><strong>Analysis mode</strong><small>Select entries to calculate a total</small></span>
          <p-toggleswitch [(ngModel)]="analysis" inputId="analysis-mode" />
        </div>
      </div>
    </ng-template>

    <div class="transactions-filter"><app-status-filter [needAdvancedFilter]="true" [isFirstTransaction]="false" /></div>
    <div class="transactions-table"><app-transaction-item-component [data]="data" (transactionToUpdate)="onUpdateTransaction($event)" [analysis]="analysis" /></div>
  </p-card>

  <p-button class="transactions-fab" icon="pi pi-plus" styleClass="app-button app-button--primary app-button--icon-only app-button--large" [rounded]="true" size="large" (onClick)="openNewTransactionModal()" ariaLabel="Add a transaction" />

  @if(isNewTransactionOpen) {
    <app-new-transaction class="quick-transaction-menu" [isTypeNormal]="false" (openForm)="openForm($event)" />
  }

  <app-transaction-form [isIn]="isIn" [isUpdate]="isUpdate" [openForm]="isOpenForm" (closeForm)="onCloseForm()" [transactionToUpdate]="transactionToUpdate" />
</section>
