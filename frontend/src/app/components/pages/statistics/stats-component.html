<section class="statistics-shell">
  <header class="statistics-header">
    <div>
      <p class="statistics-eyebrow">Insights</p>
      <h1>Financial statistics</h1>
      <p>Explore your balance, expenses and savings over time.</p>
    </div>
    <div class="statistics-period"><i class="pi pi-chart-line"></i><span>Live financial overview</span></div>
  </header>

  <div class="statistics-grid">
    <p-card class="statistics-chart-card">
      <ng-template #header>
        <div class="statistics-card-header">
          <div>
            <h2>Financial evolution</h2>
            <p>Track the changes in your financial position.</p>
          </div>
          <span class="chart-header-icon"><i class="pi pi-chart-bar"></i></span>
        </div>
      </ng-template>
      <div class="chart-workspace"><app-graph-component /></div>
    </p-card>

    <p-card class="statistics-control-card">
      <ng-template #header>
        <div class="statistics-card-header">
          <div>
            <h2>Chart controls</h2>
            <p>Adjust the display scale.</p>
          </div>
          <span class="chart-header-icon"><i class="pi pi-sliders-h"></i></span>
        </div>
      </ng-template>
      <div class="filter-workspace">
        <app-graph-filters (scaleChange)="onScaleChange($event)" (resetScaleEvent)="onResetScale()" />
      </div>
    </p-card>
  </div>
</section>
