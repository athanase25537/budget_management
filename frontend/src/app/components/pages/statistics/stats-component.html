<div class="w-full h-full flex flex-col md:flex-row gap-6">
    <div class="flex-1 min-w-0 dark:backdrop-blur-md border border-zinc-200 dark:border-zinc-800 rounded-2xl p-6 shadow-sm">
        <app-graph-component/>
    </div>
    
    <div class="w-full md:w-[420px] dark:backdrop-blur-md border border-zinc-200 dark:border-zinc-800 rounded-2xl p-6 shadow-sm flex flex-col">
        
        <div class="flex items-center gap-2.5 mb-6 pb-4 border-b border-zinc-200 dark:border-zinc-800">
            <div class="inline-flex h-8 w-8 items-center justify-center rounded-xl bg-blue-50 text-blue-600 dark:bg-blue-500/10 dark:text-blue-400">
                <i class="fa-solid fa-sliders text-sm"></i>
            </div>
            <h2 class="text-xs font-bold text-zinc-400 dark:text-slate-500 uppercase tracking-wider">Filtres & Options</h2>
        </div>
        
        <div class="flex-1">
            <app-graph-filters 
                (scaleChange)="onScaleChange($event)"
                (resetScaleEvent)="onResetScale()"
            />
        </div>
    </div>
</div>
