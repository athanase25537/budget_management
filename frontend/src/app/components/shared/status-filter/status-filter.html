<div class="filter flex flex-wrap xl:flex-nowrap items-center gap-3 p-1 text-xs font-medium">
  <div class="flex flex-wrap items-center gap-2">
    <div class="inline-flex h-8 w-8 items-center justify-center rounded-xl bg-blue-50 text-blue-600 dark:bg-blue-500/10 dark:text-blue-400">
      <i class="fa-solid fa-sliders text-sm"></i>
    </div>
    <div class="flex flex-wrap items-center gap-1 rounded-xl border border-zinc-200 dark:border-zinc-800 p-1">
      <button (click)="filterTransactions('is_in')"
              class="inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 font-semibold transition-all cursor-pointer"
              [class.bg-blue-600]="activeFilter === 'is_in'" [class.border-blue-600]="activeFilter === 'is_in'" [class.text-white]="activeFilter === 'is_in'"
              [class.bg-transparent]="activeFilter !== 'is_in'" [class.border-transparent]="activeFilter !== 'is_in'" [class.text-zinc-600]="activeFilter !== 'is_in'" [class.dark:text-slate-300]="activeFilter !== 'is_in'">
        <i class="fa-solid fa-arrow-trend-up text-[10px]"></i> In
      </button>
      <button (click)="filterTransactions('is_out')"
              class="inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 font-semibold transition-all cursor-pointer"
              [class.bg-blue-600]="activeFilter === 'is_out'" [class.border-blue-600]="activeFilter === 'is_out'" [class.text-white]="activeFilter === 'is_out'"
              [class.bg-transparent]="activeFilter !== 'is_out'" [class.border-transparent]="activeFilter !== 'is_out'" [class.text-zinc-600]="activeFilter !== 'is_out'" [class.dark:text-slate-300]="activeFilter !== 'is_out'">
        <i class="fa-solid fa-arrow-trend-down text-[10px]"></i> Out
      </button>
      <button (click)="filterTransactions('all')"
              class="inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 font-semibold transition-all cursor-pointer"
              [class.bg-blue-600]="activeFilter === 'all'" [class.border-blue-600]="activeFilter === 'all'" [class.text-white]="activeFilter === 'all'"
              [class.bg-transparent]="activeFilter !== 'all'" [class.border-transparent]="activeFilter !== 'all'" [class.text-zinc-600]="activeFilter !== 'all'" [class.dark:text-slate-300]="activeFilter !== 'all'">
        <i class="fa-solid fa-layer-group text-[10px]"></i> All
      </button>
    </div>

    @if(needAdvancedFilter()) {
      <div class="hidden h-7 w-px bg-zinc-200 dark:bg-zinc-800 lg:block"></div>
      
      <div class="flex flex-wrap items-center gap-1 rounded-xl border border-zinc-200 dark:border-zinc-800 p-1">
        <button (click)="setTimePeriod('week')"
                class="rounded-full border px-3 py-1.5 font-semibold transition-all cursor-pointer"
                [class.bg-blue-600]="timePeriod === 'week'" [class.border-blue-600]="timePeriod === 'week'" [class.text-white]="timePeriod === 'week'"
                [class.bg-transparent]="timePeriod !== 'week'" [class.border-transparent]="timePeriod !== 'week'" [class.text-zinc-600]="timePeriod !== 'week'" [class.dark:text-slate-300]="timePeriod !== 'week'">This week</button>
        <button (click)="setTimePeriod('month')"
                class="rounded-full border px-3 py-1.5 font-semibold transition-all cursor-pointer"
                [class.bg-blue-600]="timePeriod === 'month'" [class.border-blue-600]="timePeriod === 'month'" [class.text-white]="timePeriod === 'month'"
                [class.bg-transparent]="timePeriod !== 'month'" [class.border-transparent]="timePeriod !== 'month'" [class.text-zinc-600]="timePeriod !== 'month'" [class.dark:text-slate-300]="timePeriod !== 'month'">This month</button>
        <button (click)="setTimePeriod('year')"
                class="rounded-full border px-3 py-1.5 font-semibold transition-all cursor-pointer"
                [class.bg-blue-600]="timePeriod === 'year'" [class.border-blue-600]="timePeriod === 'year'" [class.text-white]="timePeriod === 'year'"
                [class.bg-transparent]="timePeriod !== 'year'" [class.border-transparent]="timePeriod !== 'year'" [class.text-zinc-600]="timePeriod !== 'year'" [class.dark:text-slate-300]="timePeriod !== 'year'">This year</button>
      </div>
    }
  </div>

  @if(needAdvancedFilter()) {
    <div class="flex flex-wrap items-center gap-2 xl:border-l xl:border-zinc-200 xl:dark:border-zinc-800 xl:ps-3">
      <div class="flex items-center gap-2 border-zinc-200 dark:border-zinc-800 rounded-xl border p-1"
          [class.border-blue-500]="!!selectedDate" [class.dark:border-blue-500]="!!selectedDate"
          [class.border-zinc-200]="!selectedDate" [class.dark:border-slate-800]="!selectedDate">
        <i class="fa-solid fa-calendar-day text-[11px] text-zinc-400 dark:text-slate-500"></i>
        <label class="text-[10px] font-bold uppercase tracking-wide text-zinc-400 dark:text-slate-500">Date</label>
        <input type="date" [(ngModel)]="selectedDate" (change)="onDateChange()"
              class="py-1.5 min-w-0 bg-transparent text-zinc-700 dark:text-slate-200 outline-none cursor-pointer" />
      </div>

      <div class="flex flex-wrap items-center gap-2 border-zinc-200 dark:border-zinc-800 rounded-xl border p-1"
          [class.border-red-500]="isDateRangeInvalid" [class.dark:border-red-500]="isDateRangeInvalid"
          [class.border-blue-500]="!isDateRangeInvalid && !!(startDate || endDate)" [class.dark:border-blue-500]="!isDateRangeInvalid && !!(startDate || endDate)"
          [class.border-zinc-200]="!isDateRangeInvalid && !(startDate || endDate)" [class.dark:border-slate-800]="!isDateRangeInvalid && !(startDate || endDate)"
          [attr.aria-invalid]="isDateRangeInvalid" [title]="isDateRangeInvalid ? 'The start date must be before or equal to the end date.' : ''">
        <i class="fa-solid fa-calendar-week text-[11px] text-zinc-400 dark:text-slate-500"></i>
        <span class="text-[10px] font-bold uppercase tracking-wide text-zinc-400 dark:text-slate-500">Range</span>
        <input type="date" [(ngModel)]="startDate" (change)="onDateRangeChange()" [max]="endDate || ''"
              class="py-1.5 min-w-0 bg-transparent text-zinc-700 dark:text-slate-200 outline-none cursor-pointer" aria-label="Start date" />
        <span class="text-zinc-300 dark:text-slate-700">→</span>
        <input type="date" [(ngModel)]="endDate" (change)="onDateRangeChange()" [min]="startDate || ''"
              class="py-1.5 min-w-0 bg-transparent text-zinc-700 dark:text-slate-200 outline-none cursor-pointer" aria-label="End date" />
      </div>

      <button (click)="resetDateFilters()"
              class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-zinc-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 text-zinc-400 transition-all hover:border-blue-200 hover:bg-blue-50 hover:text-blue-600 dark:hover:border-blue-500/30 dark:hover:bg-blue-500/10 dark:hover:text-blue-400 cursor-pointer"
              title="Reset dates" aria-label="Reset dates">
        <i class="fa-solid fa-arrow-rotate-left text-[11px]"></i>
      </button>
    </div>
  }
</div>
