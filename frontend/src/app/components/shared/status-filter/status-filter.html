<div class="filter">
  <div class="filter__groups">
    <div class="filter__icon" aria-hidden="true">
      <i class="fa-solid fa-sliders text-sm"></i>
    </div>
    <div class="filter__group" aria-label="Transaction type">
      <button (click)="filterTransactions('is_in')"
              class="filter__option"
              [class.filter__option--active]="activeFilter === 'is_in'">
        <i class="fa-solid fa-arrow-trend-up text-[10px]"></i> In
      </button>
      <button (click)="filterTransactions('is_out')"
              class="filter__option"
              [class.filter__option--active]="activeFilter === 'is_out'">
        <i class="fa-solid fa-arrow-trend-down text-[10px]"></i> Out
      </button>
      <button (click)="filterTransactions('all')"
              class="filter__option"
              [class.filter__option--active]="activeFilter === 'all'">
        <i class="fa-solid fa-layer-group text-[10px]"></i> All
      </button>
    </div>

    @if(needAdvancedFilter()) {
      <span class="filter__divider" aria-hidden="true"></span>
      
      <div class="filter__group" aria-label="Time period">
        <button (click)="setTimePeriod('week')"
                class="filter__option"
                [class.filter__option--active]="timePeriod === 'week'">This week</button>
        <button (click)="setTimePeriod('month')"
                class="filter__option"
                [class.filter__option--active]="timePeriod === 'month'">This month</button>
        <button (click)="setTimePeriod('year')"
                class="filter__option"
                [class.filter__option--active]="timePeriod === 'year'">This year</button>
      </div>
    }
  </div>

  @if(needAdvancedFilter()) {
    <div class="filter__dates">
      <label class="filter__date-control" [class.filter__date-control--active]="!!selectedDate">
        <i class="fa-solid fa-calendar-day" aria-hidden="true"></i>
        <span>Date</span>
        <input type="date" [(ngModel)]="selectedDate" (change)="onDateChange()"
              aria-label="Date" />
      </label>

      <div class="filter__date-control filter__date-range"
          [class.filter__date-control--invalid]="isDateRangeInvalid"
          [class.filter__date-control--active]="!isDateRangeInvalid && !!(startDate || endDate)"
          [attr.aria-invalid]="isDateRangeInvalid" [title]="isDateRangeInvalid ? 'The start date must be before or equal to the end date.' : ''">
        <i class="fa-solid fa-calendar-week" aria-hidden="true"></i>
        <span>Range</span>
        <input type="date" [(ngModel)]="startDate" (change)="onDateRangeChange()" [max]="endDate || ''"
              aria-label="Start date" />
        <span class="filter__range-separator">→</span>
        <input type="date" [(ngModel)]="endDate" (change)="onDateRangeChange()" [min]="startDate || ''"
              aria-label="End date" />
      </div>

      <button (click)="resetDateFilters()"
              class="filter__reset"
              title="Reset dates" aria-label="Reset dates">
        <i class="fa-solid fa-arrow-rotate-left text-[11px]"></i>
      </button>
    </div>
  }
</div>
